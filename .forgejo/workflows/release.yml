name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUST_VERSION: "1.94"

jobs:
  release:
    runs-on: docker
    container:
      image: node:24-trixie
    steps:
      # actions/cache compresses with zstd when it is on PATH, and forgejo-release needs jq.
      - name: Install zstd and jq
        run: apt-get update && apt-get install -y --no-install-recommends zstd jq

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Cache the Rust toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-${{ env.RUST_VERSION }}

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('sandbox/package-lock.json') }}

      - name: Build the bot
        run: cargo build --release --locked

      - name: Build the sandbox
        run: |
          npm --prefix sandbox ci
          npm --prefix sandbox run build
          npm --prefix sandbox prune --omit=dev --omit=optional

      - name: Stage the release
        run: |
          sandbox=root/usr/local/lib/reseam-bot/sandbox
          mkdir -p "$sandbox" root/usr/local/bin root/etc/reseam-bot dist
          cp -r sandbox/dist sandbox/container sandbox/package.json sandbox/node_modules "$sandbox/"
          cp target/release/reseam-bot root/usr/local/bin/
          cp config.toml root/etc/reseam-bot/
          tar --owner=0 --group=0 --numeric-owner -C root -czf dist/reseam-bot-linux-x64.tar.gz .

      # forgejo-release tags first and publishes a draft made from the tag, which Forgejo can lose the tag for.
      # A release created with its target commit makes its own tag.
      - name: Publish the release
        env:
          TOKEN: ${{ github.token }}
        run: |
          api=https://git.reseam.app/api/v1/repos/reseam/bot
          auth="Authorization: token $TOKEN"
          for path in releases/tags/latest tags/latest; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$auth" "$api/$path")
            [ "$status" = 204 ] || [ "$status" = 404 ] || { echo "DELETE $path returned $status"; exit 1; }
          done
          id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d '{"tag_name": "latest", "name": "latest", "target_commitish": "${{ github.sha }}"}' \
            "$api/releases" | jq -er .id)
          curl -fsS -X POST -H "$auth" -F "attachment=@dist/reseam-bot-linux-x64.tar.gz" \
            "$api/releases/$id/assets?name=reseam-bot-linux-x64.tar.gz" > /dev/null

      - name: Deploy
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-Gitea-Event: push" \
            -d '{"ref": "refs/heads/main", "after": "${{ github.sha }}"}' "$DOKPLOY_WEBHOOK"
