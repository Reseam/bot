name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/reseam/ci:2026.10.19
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            ~/.npm
          key: deps-${{ hashFiles('**/Cargo.lock', '**/package-lock.json') }}
          restore-keys: deps-

      - run: just release
