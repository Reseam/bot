data_dir = "${DATA_DIR}"

[discord]
token = "${DISCORD_TOKEN}"
guild_id = "${DISCORD_GUILD_ID}"

[access]
owner_ids = ["${DISCORD_OWNER_ID}"]
role_ids = ["${DISCORD_TEAM_ROLE_ID}", "${DISCORD_AI_ROLE_ID}"]

[llm]
base_url = "${LLM_BASE_URL}"
api_key = "${LLM_API_KEY}"
model = "${LLM_MODEL}"
context_window = 1048576
max_output_tokens = 16000
vision = true
extra_body = { provider = { ignore = ["Alibaba"] } }

[agent]
max_turns = 40

[forges.forgejo]
kind = "forgejo"
url = "${FORGEJO_URL}"
token = "${FORGEJO_TOKEN:-}"
default_repo = "reseam/reseam"

[forges.github]
kind = "github"
url = "https://api.github.com"
token = "${GITHUB_TOKEN:-}"

[sandbox]
entry = "${SANDBOX_ENTRY:-sandbox/dist/main.js}"

[mcp.exa]
url = "https://mcp.exa.ai/mcp"
headers = { "x-api-key" = "${EXA_API_KEY}" }
tools = ["web_search_exa", "web_fetch_exa"]
