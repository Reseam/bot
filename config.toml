data_dir = "${DATA_DIR}"

[discord]
token = "${DISCORD_TOKEN}"
guild_id = "${DISCORD_GUILD_ID}"

[access]
owner_ids = ["${DISCORD_OWNER_ID}"]
team_role_ids = ["${DISCORD_TEAM_ROLE_ID}"]

[llm]
base_url = "${LLM_BASE_URL}"
api_key = "${LLM_API_KEY}"
model = "${LLM_MODEL}"
context_window = 128000
max_output_tokens = 16000
vision = true

[agent]
max_turns = 40
history_messages = 30

[forges.forgejo]
kind = "forgejo"
url = "${FORGEJO_URL}"
token = "${FORGEJO_TOKEN:-}"
default_repo = "reseam/reseam"

[forges.github]
kind = "github"
url = "https://api.github.com"
token = "${GITHUB_TOKEN:-}"

[shell]
enabled = true
timeout_secs = 120
